name: C++ validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  headless:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: gcc, cxx: g++, mode: Release, sanitize: 'OFF'}
          - {cc: clang, cxx: clang++, mode: Release, sanitize: 'OFF'}
          - {cc: gcc, cxx: g++, mode: Debug, sanitize: 'ON'}
    steps:
      - uses: actions/checkout@v4
      - name: Configure with graphics disabled
        run: cmake -S . -B build -DASHFALL_VIEWER=OFF -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DASHFALL_SANITIZERS=${{ matrix.sanitize }}
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
      - name: All cross-compiler golden replays
        if: matrix.mode == 'Release'
        run: python3 tests/integration.py --bin build --all-goldens
      - name: Verify no graphics linkage
        run: '! ldd build/ashfall_headless | grep -Ei "raylib|libGL|libX11|libwayland"'
  minimal-image:
    runs-on: ubuntu-24.04
    container: gcc:13
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y cmake python3
      - run: cmake -S . -B build -DASHFALL_VIEWER=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 2 && ctest --test-dir build --output-on-failure
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: find include src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
  viewer-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - run: cmake -S . -B build -DASHFALL_VIEWER=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 2
  python-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build -j 2
      - run: python tests/bridge_tests.py --library "$PWD/build/libashfall_bridge.so"
      - run: python python/train_mappo.py --library "$PWD/build/libashfall_bridge.so" --envs 1 --iterations 1 --rollout 2 --epochs 1 --out runs/smoke
